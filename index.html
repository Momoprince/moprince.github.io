<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>圣诞照片树 · 重要的人</title>
<meta name="description" content="把身边重要的人的头像，挂上一棵会旋转的圣诞树。">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>

<header class="topbar">
  <div class="actions">
    <button id="btn-rotate" class="chip" type="button" aria-pressed="true">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      自动旋转
    </button>
    <button id="btn-spread" class="chip" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 2l1.8 5.2L19 5.5l-3.2 4.3L21 12l-6.2 2.1L18 19.5l-5.2-1.7L12 23l-1.8-5.2L5 19.5l3.2-4.4L2 12l6.2-2L4.8 5.5l5.4 1.7z"/></svg>
      绽放
    </button>
    <button id="btn-music" class="chip" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
      音乐
    </button>
    <button id="btn-help" class="chip" type="button">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 17h-2v-2h2v2zm1.8-7.3c-.5.6-1 .9-1.3 1.2-.3.4-.5.7-.5 1.6h-2c0-1.4.4-2 .9-2.6l1.2-1.3c.4-.4.6-.8.6-1.3 0-.9-.7-1.5-1.7-1.5-1 0-1.7.6-1.8 1.7H8.1C8.2 7.2 9.8 6 12 6c2.1 0 3.6 1.1 3.6 2.9 0 .9-.3 1.6-.8 2.1z"/></svg>
      换成我的照片
    </button>
  </div>
  <div class="brand">
    <p class="eyebrow" aria-hidden="true">❄ &nbsp;MERRY CHRISTMAS&nbsp; ❄</p>
    <h1>圣诞照片树</h1>
    <p class="sub">把最重要的人，挂上这棵圣诞树</p>
  </div>
</header>

<main class="stage-wrap">
  <div id="stage" class="stage" role="application"
       aria-label="圣诞照片树：拖动可以旋转，滚轮缩放，点击照片查看大图">
    <div id="tree" class="tree">
      <div id="star-top" class="star-top" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="34" height="34"><path fill="currentColor" d="M12 1.5 14.6 8.2l7 .5-5.4 4.5 1.7 6.8L12 17.7 6.1 21l1.7-6.8L2.4 8.7l7-.5z"/></svg>
      </div>
    </div>
    <p class="hint" id="hint">拖动旋转 · 滚轮缩放 · 点照片看大图</p>
  </div>
  <p class="count" id="count" aria-live="polite"></p>
</main>

<!-- 大图灯箱 -->
<div id="lightbox" class="overlay" role="dialog" aria-modal="true" aria-labelledby="lb-name" hidden>
  <div class="overlay-bg" data-close></div>
  <figure class="polaroid">
    <button class="close" type="button" data-close aria-label="关闭大图">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/></svg>
    </button>
    <div class="photo-frame"><img id="lb-img" alt=""></div>
    <figcaption>
      <strong id="lb-name"></strong>
      <span id="lb-note"></span>
    </figcaption>
  </figure>
</div>

<!-- 换照片说明 -->
<div id="help" class="overlay" role="dialog" aria-modal="true" aria-labelledby="help-title" hidden>
  <div class="overlay-bg" data-close></div>
  <div class="panel">
    <button class="close" type="button" data-close aria-label="关闭说明">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/></svg>
    </button>
    <h2 id="help-title">换成你重要的人</h2>
    <ol class="steps">
      <li>把 Ta 们的照片（jpg / png 都可以）复制到项目的 <code>image/</code> 文件夹里。</li>
      <li>打开项目根目录的 <code>photos.js</code>，把每一行的 <code>img</code> 改成你的照片文件名，<code>name</code> 改成 Ta 的称呼，<code>note</code> 写一句想说的话。</li>
      <li>保存后刷新页面，圣诞树上就都是你在乎的人了。人数随便加减，树会自己挂好。</li>
    </ol>
    <p class="tip">提示：方形或接近方形的照片效果最好，建议每张不超过 500 KB。</p>
  </div>
</div>

<script src="./photos.js"></script>
<audio id="bgm" src="./曲1.mp3" loop preload="auto"></audio>
<script type="module" src="./src/main.js"></script>
</body>
</html>
