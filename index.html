<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生日快乐 · 重要的人</title>
<meta name="description" content="把身边重要的人的照片，请到这个生日蛋糕旁。">
<link rel="stylesheet" href="./src/style.css">
</head>
<body>

<canvas id="bg" aria-hidden="true"></canvas>

<header class="topbar">
  <div class="actions">
    <button id="btn-rotate" class="chip" type="button" aria-pressed="true">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
      自动旋转
    </button>
    <button id="btn-spread" class="chip" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 2l1.8 5.2L19 5.5l-3.2 4.3L21 12l-6.2 2.1L18 19.5l-5.2-1.7L12 23l-1.8-5.2L5 19.5l3.2-4.4L2 12l6.2-2L4.8 5.5l5.4 1.7z"/></svg>
      绽放
    </button>
    <button id="btn-music" class="chip" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
      音乐
    </button>
  </div>
  <div class="brand">
    <p class="eyebrow" aria-hidden="true">✦ &nbsp;HAPPY BIRTHDAY&nbsp; ✦</p>
    <h1>生日快乐</h1>
    <p class="sub">把最重要的人，请到这个生日里</p>
  </div>
</header>

<main class="stage-wrap">
  <div id="stage" class="stage" role="application"
       aria-label="生日蛋糕：拖动可以旋转，滚轮缩放，点击照片查看大图">
    <div id="tree" class="tree"></div>
    <p class="hint" id="hint">拖动旋转 · 滚轮缩放 · 点照片看大图</p>
  </div>
  <p class="count" id="count" aria-live="polite"></p>
</main>

<!-- 大图灯箱 -->
<div id="lightbox" class="overlay" role="dialog" aria-modal="true" aria-labelledby="lb-name" hidden>
  <div class="overlay-bg" data-close></div>
  <figure class="polaroid">
    <button class="close" type="button" data-close aria-label="关闭大图">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M18.3 5.7 12 12l6.3 6.3-1.4 1.4L10.6 13.4 4.3 19.7 2.9 18.3 9.2 12 2.9 5.7l1.4-1.4 6.3 6.3 6.3-6.3z"/></svg>
    </button>
    <div class="photo-frame"><img id="lb-img" alt=""></div>
    <figcaption>
      <strong id="lb-name"></strong>
      <span id="lb-note"></span>
    </figcaption>
  </figure>
</div>

<script src="./photos.js"></script>
<audio id="bgm" src="./曲1.mp3" loop preload="auto"></audio>
<script type="module" src="./src/main.js"></script>
</body>
</html>
